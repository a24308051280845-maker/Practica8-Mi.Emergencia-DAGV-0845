    <!-- SECCIÓN: CONTACTO DE EMERGENCIA -->
    <section>
        <h2>Contacto de Emergencia</h2>
        <p>Complete el siguiente formulario para registrar un reporte o solicitud de asistencia:</p>
        
        <form>
            <p>
                <label for="nombre">Nombre completo:</label><br>
                <input type="text" id="nombre" name="nombre">
            </p>

            <p>
                <label for="telefono">Teléfono de contacto:</label><br>
                <input type="text" id="telefono" name="telefono">
            </p>

            <p>
                <label for="ubicacion">Dirección / Ubicación del incidente:</label><br>
                <input type="text" id="ubicacion" name="ubicacion">
            </p>

            <p>
                <label for="tipo">Seleccione el Tipo de emergencia:</label><br>
                <select id="tipo" name="tipo">
                    <option value="">-- Seleccione una opción --</option>
                    <option value="medica">Emergencia Médica</option>
                    <option value="incendio">Incendio / Fuga de gas</option>
                    <option value="seguridad">Seguridad / Policía</option>
                    <option value="desastre">Desastre Natural</option>
                    <option value="otro">Otro tipo de auxilio</option>
                </select>
            </p>

            <p>
                <label for="descripcion">Descripción de lo sucedido:</label><br>
                <textarea id="descripcion" name="descripcion" rows="4" cols="40"></textarea>
            </p>

            <p>
                <input type="submit" value="Enviar Reporte">
            </p>
        </form>
    </section>
